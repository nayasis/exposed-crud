name: Publish to Maven Central

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        run: ./gradlew clean publish --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername      : ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword      : ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId      : ${{ secrets.SIGNING_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PW }}
          ORG_GRADLE_PROJECT_signingInMemoryKey        : ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_mavenReleaseVersion       : ${{ vars.RELEASE_VERSION }}
